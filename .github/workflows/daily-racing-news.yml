name: Daily Racing News Email

on:
  schedule:
    # Runs at 7:00 AM GMT every day
    # GitHub Actions uses UTC, so 7:00 GMT = 07:00 UTC
    - cron: '0 7 * * *'
  
  # Allows manual trigger from Actions tab
  workflow_dispatch:

jobs:
  send-racing-news:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run racing news scraper
      run: |
        python racing_news_scraper.py
      env:
        TZ: 'Europe/London'
    
    - name: Log completion
      if: always()
      run: |
        echo "Racing news job completed at $(date)"
